<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Segmentation App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎯 Customer Segmentation Analysis</h1>
            <p>Predict customer segment based on spending behavior</p>
        </header>

        <div class="main-content">
            <div class="input-section">
                <h2>Enter Customer Details</h2>
                <form id="predictionForm">
                    <div class="form-group">
                        <label for="annualIncome">Annual Income (k$):</label>
                        <input type="number" id="annualIncome" name="annual_income" min="0" max="200" step="1" required
                            placeholder="e.g., 50">
                        <span class="range-hint">Range: 0 - 200</span>
                    </div>

                    <div class="form-group">
                        <label for="spendingScore">Spending Score (1-100):</label>
                        <input type="number" id="spendingScore" name="spending_score" min="1" max="100" step="1"
                            required placeholder="e.g., 75">
                        <span class="range-hint">Range: 1 - 100</span>
                    </div>

                    <button type="submit" class="predict-btn">Predict Segment</button>
                </form>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h2>Prediction Results</h2>
                <div class="result-card">
                    <div class="result-item">
                        <span class="label">Segment:</span>
                        <span class="value" id="clusterId">-</span>
                    </div>
                    <div class="result-item">
                        <span class="label">Description:</span>
                        <span class="value" id="clusterDescription">-</span>
                    </div>
                    <div class="result-item">
                        <span class="label">Average Income in Segment:</span>
                        <span class="value" id="avgIncome">-</span>
                    </div>
                    <div class="result-item">
                        <span class="label">Average Spending in Segment:</span>
                        <span class="value" id="avgSpending">-</span>
                    </div>
                </div>

                <div class="recommendations">
                    <h3>💡 Recommendations</h3>
                    <ul id="recommendationsList"></ul>
                </div>
            </div>
        </div>

        <footer>
            <p>Built by ❤️ Praveen Kumar</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
